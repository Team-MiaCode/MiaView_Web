name: Web preview
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm run check:repo && npm test
      - run: npm install --no-save --package-lock=false typescript@5.9.3
      - run: npx tsc --noEmit --strict --module NodeNext --moduleResolution NodeNext --target ES2022 --lib ES2022,DOM tests/types.ts

  build-preview:
    needs: source-checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y ninja-build libegl1 libopengl0 libxcb-cursor0 libxkbcommon-x11-0
      - run: python -m pip install -r scripts/qt-requirements.txt
      - uses: actions/cache@v4
        with:
          path: |
            .deps/qt
            .deps/downloads
          key: qt-preview-${{ runner.os }}-${{ hashFiles('native/toolchain.json', 'scripts/install-qt.py') }}
      - run: python scripts/install-qt.py
      - name: Install Emscripten matched to Qt
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git .deps/emsdk
          version=$(node -p "JSON.parse(require('fs').readFileSync('native/toolchain.json')).emscriptenVersion")
          .deps/emsdk/emsdk install "$version"
          .deps/emsdk/emsdk activate "$version"
      - run: npm run build:native && npm run check:source
      - run: npm install --no-save --package-lock=false playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser && npm run test:ui && npm run test:pages
      - run: npm run build:pages
      - uses: actions/upload-artifact@v4
        with:
          name: miaview-preview
          path: |
            sdk
            renderer
            backend
            README.md
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: miaview-pages
          path: artifacts/pages
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-screenshots
          path: artifacts/ui

  deploy-pages:
    needs: build-preview
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
        id: pages
      - name: Publish main and feature together
        uses: actions/github-script@v7
        id: deployment
        env:
          PAGES_URL: ${{ steps.pages.outputs.base_url }}
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              ...context.repo,
              workflow_id: 'web.yml',
              ref: 'feature/web-editor-migration',
              inputs: { main_run_id: String(context.runId) },
            });
            core.setOutput('page_url', process.env.PAGES_URL);

      - name: Download Pages artifact
        uses: actions/download-artifact@v4
        with:
          name: miaview-pages
          path: artifacts/pages

      - name: Deploy to EdgeOne Pages
        uses: TencentEdgeOne/edgeone-pages-action@v1
        with:
          token: ${{ secrets.EDGEONE_API_TOKEN }}
          project-name: "miaview"
          build-path: "./artifacts/pages"

name: Web preview
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      main_run_id:
        description: Main workflow run providing its validated Pages artifact
        required: false
        type: string
        default: ''
      editor_run_id:
        description: Successful editor deployment supplying the Main and editor Pages
        type: string

permissions:
  contents: read

jobs:
  source-checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm run check:repo && npm test
      - run: npm install --no-save --package-lock=false typescript@5.9.3
      - run: npx tsc -p tests/tsconfig.json

  build-preview:
    needs: source-checks
    if: ${{ !inputs.editor_run_id }}
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Use Ubuntu HTTPS package mirror
        run: printf '%s\n' 'https://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt
      - run: sudo apt-get update && sudo apt-get install -y ninja-build libegl1 libopengl0 libxcb-cursor0 libxkbcommon-x11-0 libgl1-mesa-dri mesa-utils xvfb
      - run: python -m pip install -r scripts/qt-requirements.txt
      - uses: actions/cache@v4
        with:
          path: |
            .deps/qt
            .deps/downloads
          key: qt-preview-${{ runner.os }}-${{ hashFiles('native/toolchain.json', 'scripts/install-qt.py') }}
      - run: python scripts/install-qt.py
      - name: Install Emscripten matched to Qt
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git .deps/emsdk
          version=$(node -p "JSON.parse(require('fs').readFileSync('native/toolchain.json')).emscriptenVersion")
          .deps/emsdk/emsdk install "$version"
          .deps/emsdk/emsdk activate "$version"
      - run: npm run build:native && npm run check:source
      - run: npm install --no-save --package-lock=false playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser && npm run test:ui && npm run test:pages
      - run: npm run build:pages && npm run sync:products -- --runtime && npm run check:products
      - name: Validate feature Pages prefix
        env:
          MIACODE_PAGES_PREFIX: /MiaView_Web/feature/
        run: npm run test:pages
      - uses: actions/upload-artifact@v4
        with:
          name: miaview-preview
          path: |
            sdk
            renderer
            ui
            services
            index.html
            app.mjs
            page.css
            preview-window.html
            backend
            README.md
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: miaview-editor
          path: build-devtools/products/editor
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: miaview-preview-standalone
          path: build-devtools/products/preview
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: miaview-pages
          path: build-devtools/pages
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: preview-screenshots
          path: artifacts/ui

  functional-acceptance:
    needs: build-preview
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: miaview-preview
          path: .
      - run: npm run check:source
      - run: npm install --no-save --package-lock=false playwright@1.62.1
      - name: Use Ubuntu HTTPS package mirror
        run: printf '%s\n' 'https://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Configure clocked audio output
        run: |
          sudo apt-get install -y pulseaudio pulseaudio-utils
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=miaview_test rate=48000
          pactl set-default-sink miaview_test
          pactl info
      - name: Validate browser audio clock
        env:
          MIACODE_BROWSER: ${{ matrix.browser }}
        run: xvfb-run --auto-servernum node tests/audio-clock-smoke.mjs
      - name: Validate editor functions and creator workflow
        env:
          MIACODE_BROWSER: ${{ matrix.browser }}
          DEBUG: pw:browser
        run: xvfb-run --auto-servernum npm run test:stage2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage2-${{ matrix.browser }}
          path: artifacts/stage2
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: shortcuts-debug-${{ matrix.browser }}
          path: artifacts/shortcuts-core/failure.json

  ui-acceptance:
    needs: build-preview
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: miaview-preview
          path: .
      - run: npm run check:source
      - name: Use Ubuntu HTTPS package mirror
        run: printf '%s\n' 'https://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt
      - run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dri mesa-utils xvfb
      - run: npm install --no-save --package-lock=false playwright@1.62.1
      - run: npx playwright install --with-deps chromium firefox webkit chrome msedge
      - name: Configure UI audio output
        run: |
          sudo apt-get install -y pulseaudio pulseaudio-utils
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=miaview_products rate=48000
          pactl set-default-sink miaview_products
      - name: Validate workbench and isolated editor template
        env:
          DEBUG: pw:browser
          MIACODE_TEST_ENGINES: chromium,firefox,webkit
          MIACODE_DENSITY_ENGINES: chrome,msedge,firefox,webkit
        run: xvfb-run --auto-servernum bash -e -c 'npm run test:source-wrap && npm run test:workbench && npm run test:density && npm run test:gallery && npm run test:folder && npm run test:cover && npm run test:transport && npm run test:timeline && npm run test:document && npm run test:analysis-ui && npm run test:editor-tabs && npm run test:workbench-chrome && npm run test:source-editor-ui && npm run test:ime && npm run test:stage1 && npm run sync:products -- --runtime && npm run test:editor-template'
      - name: Validate independent products and cross-origin embeds
        env:
          DEBUG: pw:browser
        run: |
          npm run check:products
          xvfb-run --auto-servernum npm run test:products
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-screenshots
          path: artifacts/ui
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workbench-screenshots
          path: artifacts/workbench-ui

  build-alternate-pages:
    needs: source-checks
    if: >-
      github.event_name != 'pull_request' && !inputs.editor_run_id &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature/web-editor-migration') &&
      !(github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/feature/web-editor-migration' && inputs.main_run_id != '')
    runs-on: ubuntu-24.04
    env:
      MIACODE_BUILD_DIR: ${{ github.workspace }}/build-devtools
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref == 'refs/heads/main' && 'feature/web-editor-migration' || 'main' }}
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Use Ubuntu HTTPS package mirror
        run: printf '%s\n' 'https://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt
      - run: sudo apt-get update && sudo apt-get install -y ninja-build libegl1 libopengl0 libxcb-cursor0 libxkbcommon-x11-0
      - run: python -m pip install -r scripts/qt-requirements.txt
      - uses: actions/cache@v4
        with:
          path: |
            .deps/qt
            .deps/downloads
          key: qt-preview-${{ runner.os }}-${{ hashFiles('native/toolchain.json', 'scripts/install-qt.py') }}
      - run: python scripts/install-qt.py
      - name: Install Emscripten matched to Qt
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git .deps/emsdk
          version=$(node -p "JSON.parse(require('fs').readFileSync('native/toolchain.json')).emscriptenVersion")
          .deps/emsdk/emsdk install "$version"
          .deps/emsdk/emsdk activate "$version"
      - run: npm run check:repo && npm test && npm run build:native && npm run check:source && npm run build:pages -- build-devtools/pages
      - run: git rev-parse HEAD > build-devtools/pages/source-revision.txt
      - uses: actions/upload-artifact@v4
        with:
          name: miaview-alternate-pages
          path: build-devtools/pages
          if-no-files-found: error
          retention-days: 14

  reuse-main-pages:
    needs: source-checks
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/feature/web-editor-migration' && !inputs.editor_run_id && inputs.main_run_id != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - id: source
        uses: actions/github-script@v7
        env:
          MAIN_RUN_ID: ${{ inputs.main_run_id }}
        with:
          script: |
            const run_id = Number(process.env.MAIN_RUN_ID);
            if (!Number.isSafeInteger(run_id) || run_id <= 0) throw new Error('Invalid main workflow run');
            const request = { ...context.repo, run_id };
            const { data: run } = await github.rest.actions.getWorkflowRun(request);
            if (run.head_branch !== 'main' || !['push', 'workflow_dispatch'].includes(run.event) ||
                run.head_repository?.full_name !== context.payload.repository.full_name)
              throw new Error('Pages artifact must originate from this repository main branch');
            const { data: { jobs } } = await github.rest.actions.listJobsForWorkflowRun({ ...request, filter: 'latest', per_page: 100 });
            for (const name of ['source-checks', 'build-preview'])
              if (!jobs.some(job => job.name === name && job.conclusion === 'success'))
                throw new Error('Main validation must succeed before publication: ' + name);
            core.setOutput('sha', run.head_sha);
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.main_run_id }}
          name: miaview-pages
          path: build-devtools/pages
      - env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: printf '%s\n' "$SOURCE_SHA" > build-devtools/pages/source-revision.txt
      - uses: actions/upload-artifact@v4
        with:
          name: miaview-alternate-pages
          path: build-devtools/pages
          if-no-files-found: error
          retention-days: 14

  prepare-pages:
    needs: [build-preview, build-alternate-pages, reuse-main-pages]
    if: >-
      always() && !cancelled() && github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature/web-editor-migration') &&
      needs.build-preview.result == 'success' &&
      (needs.build-alternate-pages.result == 'success' || needs.reuse-main-pages.result == 'success')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: miaview-pages
          path: build-devtools/current
      - uses: actions/download-artifact@v4
        with:
          name: miaview-alternate-pages
          path: build-devtools/alternate
      - uses: actions/checkout@v4
        with:
          ref: standalone-preview
          path: build-devtools/sdk-release
          persist-credentials: false
      - name: Compose main, feature and SDK preview sites
        env:
          CURRENT_SHA: ${{ needs.build-preview.outputs.source_sha }}
        run: |
          alternate_sha=$(cat build-devtools/alternate/source-revision.txt)
          SDK_PREVIEW_SHA=$(git -C build-devtools/sdk-release rev-parse HEAD)
          export SDK_PREVIEW_SHA
          rm build-devtools/alternate/source-revision.txt
          if [ "$GITHUB_REF" = refs/heads/main ]; then
            MAIN_SHA="$CURRENT_SHA" FEATURE_SHA="$alternate_sha" node scripts/compose-pages.mjs build-devtools/current build-devtools/alternate build-devtools/sdk-release build-devtools/deploy
          else
            MAIN_SHA="$alternate_sha" FEATURE_SHA="$CURRENT_SHA" node scripts/compose-pages.mjs build-devtools/alternate build-devtools/current build-devtools/sdk-release build-devtools/deploy
          fi
      - uses: actions/upload-pages-artifact@v4
        with:
          path: build-devtools/deploy

  prepare-verified-pages:
    needs: source-checks
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/feature/web-editor-migration' && inputs.editor_run_id != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - id: source
        uses: actions/github-script@v7
        env:
          EDITOR_RUN_ID: ${{ inputs.editor_run_id }}
        with:
          script: |
            const run_id = Number(process.env.EDITOR_RUN_ID);
            if (!Number.isSafeInteger(run_id) || run_id <= 0) throw new Error('Invalid editor run ID');
            const { data: run } = await github.rest.actions.getWorkflowRun({ ...context.repo, run_id });
            if (run.path !== '.github/workflows/web.yml' || run.head_branch !== 'feature/web-editor-migration' ||
                !['push', 'workflow_dispatch'].includes(run.event) || run.conclusion !== 'success' ||
                run.head_repository?.full_name !== context.payload.repository.full_name)
              throw new Error('Expected a successful Web preview run from feature/web-editor-migration');
            core.setOutput('editor_sha', run.head_sha);
      - name: Confirm the editor sources match the validated deployment
        env:
          EDITOR_SHA: ${{ steps.source.outputs.editor_sha }}
        run: git diff --exit-code "$EDITOR_SHA" HEAD -- . ':(exclude).github/workflows/web.yml' ':(exclude)scripts/compose-pages.mjs'
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.editor_run_id }}
          name: github-pages
          path: build-devtools/validated-editor
      - uses: actions/checkout@v4
        with:
          ref: standalone-preview
          path: build-devtools/sdk-release
          persist-credentials: false
      - name: Compose the validated editor and SDK sites
        env:
          FEATURE_SHA: ${{ steps.source.outputs.editor_sha }}
        run: |
          mkdir -p build-devtools/published
          tar -xf build-devtools/validated-editor/artifact.tar -C build-devtools/published
          MAIN_SHA=$(node -e '
            const { main, feature } = require("./build-devtools/published/deployment.json");
            if (feature?.commit !== process.env.FEATURE_SHA || !/^[0-9a-f]{40}$/.test(main?.commit))
              throw new Error("Deployment manifest does not match the validated editor run");
            console.log(main.commit);
          ')
          if [ "$MAIN_SHA" != "$(git rev-parse origin/main)" ]; then
            echo "The validated deployment does not contain the current Main revision" >&2
            exit 1
          fi
          SDK_PREVIEW_SHA=$(git -C build-devtools/sdk-release rev-parse HEAD)
          MAIN_SHA="$MAIN_SHA" SDK_PREVIEW_SHA="$SDK_PREVIEW_SHA" node scripts/compose-pages.mjs build-devtools/published build-devtools/published/feature build-devtools/sdk-release build-devtools/deploy
      - uses: actions/upload-pages-artifact@v4
        with:
          path: build-devtools/deploy

  deploy-pages:
    needs: [prepare-pages, prepare-verified-pages, ui-acceptance, functional-acceptance]
    if: >-
      always() && !cancelled() && github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature/web-editor-migration') &&
      (needs.prepare-verified-pages.result == 'success' ||
      (needs.prepare-pages.result == 'success' && needs.ui-acceptance.result == 'success' && needs.functional-acceptance.result == 'success'))
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment

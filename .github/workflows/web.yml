name: SDK release
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-sdk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - id: source
        run: |
          revision=$(node -p 'require("./sdk-source.json").commit')
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]]
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.revision }}
          path: build-devtools/sdk-source
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Qt host dependencies
        run: |
          printf '%s\n' 'https://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt
          sudo apt-get update
          sudo apt-get install -y ninja-build libegl1 libopengl0 libxcb-cursor0 libxkbcommon-x11-0
      - uses: actions/cache@v4
        with:
          path: |
            build-devtools/sdk-source/.deps/qt
            build-devtools/sdk-source/.deps/downloads
          key: qt-preview-${{ runner.os }}-${{ hashFiles('build-devtools/sdk-source/native/toolchain.json', 'build-devtools/sdk-source/scripts/install-qt.py') }}
      - name: Install the pinned toolchain
        working-directory: build-devtools/sdk-source
        run: |
          python -m pip install -r scripts/qt-requirements.txt
          python scripts/install-qt.py
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git .deps/emsdk
          version=$(node -p 'require("./native/toolchain.json").emscriptenVersion')
          .deps/emsdk/emsdk install "$version"
          .deps/emsdk/emsdk activate "$version"
      - name: Build and verify the pinned preview product
        working-directory: build-devtools/sdk-source
        run: |
          npm run check:repo
          npm test
          npm run build:native
          npm run check:source
          npm run sync:products -- --runtime
          npm run check:products
      - name: Package the SDK demo
        run: |
          node --check examples/sdk-preview/app.mjs
          npm run build:sdk-preview-demo -- build-devtools/sdk-source/build-devtools/products/preview
          cp sdk-source.json build-devtools/sdk-source/build-devtools/products/preview/
          cp sdk-source.json build-devtools/sdk-preview-demo/
      - uses: actions/upload-artifact@v4
        with:
          name: miaview-preview-standalone
          path: build-devtools/sdk-source/build-devtools/products/preview
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: miaview-sdk-preview-demo
          path: build-devtools/sdk-preview-demo
          if-no-files-found: error
          retention-days: 14
